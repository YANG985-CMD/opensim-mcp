$('search').addEventListener('input',tree);$('component-scene').addEventListener('change',tree);
$('hide-selected').addEventListener('click',()=>{if(!state.selected)return;const {scene:i,component:c}=state.selected;if(!state.hidden[i].some(x=>same(x,c)))state.hidden[i].push(c);const other=equivalent(i,c);if(other&&!state.hidden[1-i].some(x=>same(x,other)))state.hidden[1-i].push(other);tree();sync();});
$('show-all').addEventListener('click',()=>{state.hidden=E.map(()=>[]);tree();sync();});
const curveOptions=[];for(const name of Object.keys(E[0].scene.coordinate_units))curveOptions.push({key:'coordinate:'+name,label:name+' · '+E[0].scene.coordinate_units[name]});for(const s of E[0].scene.external_signals||[])curveOptions.push({key:'signal:'+s.id,label:s.label+' · '+s.unit});
for(const name of E[0].scene.muscle_names||[]){if(E[0].scene.frames.some(f=>Number.isFinite(f.muscle_forces_N?.[name])))curveOptions.push({key:'force:'+name,label:name+' · 肌肉力 N'});if(E[0].scene.frames.some(f=>Number.isFinite(f.muscle_activations?.[name])))curveOptions.push({key:'activation:'+name,label:name+' · 激活 0–1'});}
for(const item of curveOptions){const o=document.createElement('option');o.value=item.key;o.textContent=item.label;$('curve').append(o);}state.curve=curveOptions[0]?.key||'';
function series(){const [kind,...rest]=state.curve.split(':'),name=rest.join(':'),out=[];let unit='';for(let i=0;i<E.length;i++){let signal=null,key=name;if(kind==='coordinate'){if(i===1)key=equivalent(0,{kind:'coordinate',name})?.name;unit=E[0].scene.coordinate_units[name];if(!key||E[i].scene.coordinate_units[key]!==unit){out.push(null);continue;}}
 else if(kind==='force'||kind==='activation'){unit=kind==='force'?'N':'1';key=i===0?name:equivalent(0,{kind:'muscle',name})?.name;if(!key){out.push(null);continue;}}
 else{const primary=E[0].scene.external_signals?.find(s=>s.id===name);unit=primary?.unit||'';signal=i===0?primary:E[i].scene.external_signals?.find(s=>s.label===primary?.label&&s.unit===unit&&(!primary.component||same(s.component,equivalent(0,primary.component))));if(!signal){out.push(null);continue;}}
 out.push(A.indices.map(row=>row[i]===null?null:kind==='coordinate'?E[i].scene.frames[row[i]].coordinate_values[key]:kind==='force'?E[i].scene.frames[row[i]].muscle_forces_N?.[key]??null:kind==='activation'?E[i].scene.frames[row[i]].muscle_activations?.[key]??null:signal.frame_values[row[i]]));}return {values:out,unit};}
function drawCurve(){const canvas=$('plot'),width=canvas.clientWidth,ratio=Math.min(devicePixelRatio||1,2);canvas.width=width*ratio;canvas.height=180*ratio;const c=canvas.getContext('2d');c.scale(ratio,ratio);if(width<20)return;const {values,unit}=series(),validValues=values.flatMap(v=>v||[]).filter(Number.isFinite);if(!validValues.length)return;let lo=Math.min(...validValues),hi=Math.max(...validValues);if(hi-lo<1e-10){lo-=.5;hi+=.5;}const pad=(hi-lo)*.08;lo-=pad;hi+=pad;const x=t=>42+(width-52)*(t-A.times[0])/(A.times.at(-1)-A.times[0]),y=v=>150-122*(v-lo)/(hi-lo);c.strokeStyle='#d9e4eb';c.strokeRect(42,28,width-52,122);c.fillStyle='#617b8d';c.font='10px system-ui';c.fillText(unit,2,12);c.fillText(hi.toPrecision(3),0,33);c.fillText(lo.toPrecision(3),0,150);c.fillText(A.times[0].toFixed(2),42,172);c.fillText(A.times.at(-1).toFixed(2)+' s',width-44,172);
 values.forEach((v,i)=>{if(!v)return;c.beginPath();c.strokeStyle=i?'#ce822a':'#126e93';c.lineWidth=2;let started=false;v.forEach((value,j)=>{if(!Number.isFinite(value)){started=false;return;}if(started)c.lineTo(x(A.times[j]),y(value));else c.moveTo(x(A.times[j]),y(value));started=true;});c.stroke();});c.strokeStyle='#bb3b38';c.beginPath();c.moveTo(x(A.times[state.frame]),23);c.lineTo(x(A.times[state.frame]),155);c.stroke();const a=values[0]?.[state.frame],b=values[1]?.[state.frame],format=v=>Number.isFinite(v)?v.toPrecision(5)+' '+unit:'—';$('value-a').textContent=E[0].label+': '+format(a);$('value-b').hidden=E.length<2;$('value-b').textContent=(E[1]?.label||'')+': '+format(b);$('value-diff').hidden=E.length<2;$('value-diff').textContent='差值（右 − 左）: '+format(Number.isFinite(a)&&Number.isFinite(b)?b-a:null);$('curve-note').textContent=E.length===2&&!values[1]?'右侧没有对应且同单位的数据；不计算差值。':'按共同时间轴上的最近原生采样比较；空缺不填充。';document.body.dataset.curveDifference=Number.isFinite(a)&&Number.isFinite(b)?b-a:'';}
$('curve').addEventListener('change',()=>{state.curve=$('curve').value;sync();});$('plot').addEventListener('pointerdown',e=>{const r=$('plot').getBoundingClientRect(),fraction=Math.max(0,Math.min(1,(e.clientX-r.left-42)/(r.width-52))),t=A.times[0]+fraction*(A.times.at(-1)-A.times[0]);stop();selectFrame(A.times.reduce((best,v,i)=>Math.abs(v-t)<Math.abs(A.times[best]-t)?i:best,0));});
function pointOptions(){const i=state.measurement.scene;for(let j=0;j<3;j++){const s=$('point-'+j);s.replaceChildren();const blank=document.createElement('option');blank.value='';blank.textContent=j===2?'C · 不使用（测距离）':(j?'B':'A')+' · 选择点';s.append(blank);for(const kind of ['marker','frame'])for(const name of components[i][kind]){const o=document.createElement('option');o.value=JSON.stringify({kind,name});o.textContent=kinds[kind]+' / '+name;s.append(o);}s.value=state.measurement.points[j]?JSON.stringify(state.measurement.points[j]):'';}}
function measureAt(row){const i=state.measurement.scene,f=A.indices[row][i];if(f===null||state.measurement.points.length<2)return null;const points=state.measurement.points.map(p=>p.kind==='marker'?E[i].scene.frames[f].markers[p.name]:E[i].scene.frames[f].transforms[p.name]?.slice(12,15));if(!points.every(p=>p?.length===3))return null;const sub=(a,b)=>a.map((v,j)=>v-b[j]),norm=a=>Math.hypot(...a);if(points.length===2)return norm(sub(points[0],points[1]))*1000;const u=sub(points[0],points[1]),v=sub(points[2],points[1]),den=norm(u)*norm(v);return den<1e-12?null:Math.acos(Math.max(-1,Math.min(1,u.reduce((s,x,j)=>s+x*v[j],0)/den)))*180/Math.PI;}
function measurement(){const v=measureAt(state.frame);$('measurement-value').textContent=Number.isFinite(v)?v.toFixed(2)+(state.measurement.points.length===3?' °':' mm'):'选择两个不同点，或添加第三点';document.body.dataset.measurementValue=v??'';}
$('measure-scene').addEventListener('change',()=>{state.measurement={scene:+$('measure-scene').value,points:[]};pointOptions();sync();});for(let i=0;i<3;i++)$('point-'+i).addEventListener('change',()=>{const selected=[0,1,2].map(j=>$('point-'+j).value);state.measurement.points=selected[0]&&selected[1]?selected.filter(Boolean).map(JSON.parse):[];sync();});
const download=(name,type,data)=>{const a=document.createElement('a'),url=URL.createObjectURL(new Blob([data],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
const csv=rows=>'\ufeff'+rows.map(row=>row.map(v=>{let t=String(v??'');if(typeof v==='string'&&/^[=+\-@\t\r]/.test(t))t="'"+t;return '"'+t.replaceAll('"','""')+'"';}).join(',')).join('\r\n')+'\r\n';
$('export-curve').addEventListener('click',()=>{const {values,unit}=series();download('comparison.csv','text/csv;charset=utf-8',csv([['aligned_time_s','left','right','right_minus_left','unit','left_native_time_s','right_native_time_s','left_scene_sha256','right_scene_sha256','left_quality','right_quality'],...A.times.map((t,j)=>{const a=values[0]?.[j],b=values[1]?.[j],nativeTime=i=>A.indices[j][i]==null?null:E[i].scene.frames[A.indices[j][i]].time;return [t,a,b,Number.isFinite(a)&&Number.isFinite(b)?b-a:null,unit,nativeTime(0),E.length===2?nativeTime(1):null,E[0].sha256,E[1]?.sha256,quality(0),E.length===2?quality(1):''];})]));});
$('export-measure').addEventListener('click',()=>download('measurement.csv','text/csv;charset=utf-8',csv([['aligned_time_s','value','unit','scene','points'],...A.times.map((t,j)=>[t,measureAt(j),state.measurement.points.length===3?'deg':'mm',E[state.measurement.scene].label,JSON.stringify(state.measurement.points)])])));
function validate(v){if(!v||v.schema!==state.schema||v.workbench_id!==W.id)throw Error('状态文件属于其他场景或时间设置。');if(Object.keys(v).sort().join(',')!==Object.keys(state).sort().join(','))throw Error('状态字段不完整。');if(!Number.isInteger(v.frame)||v.frame<0||v.frame>=A.times.length)throw Error('无效时刻。');if(!v.camera||Object.keys(v.camera).sort().join(',')!=='pitch,yaw,zoom'||!Object.values(v.camera).every(Number.isFinite)||Math.abs(v.camera.yaw)>100||Math.abs(v.camera.pitch)>1.4||v.camera.zoom<.3||v.camera.zoom>100)throw Error('无效视角。');if(!Array.isArray(v.hidden)||v.hidden.length!==E.length||v.hidden.some((list,i)=>!Array.isArray(list)||list.length>1000||list.some(c=>!valid(i,c))))throw Error('无效隐藏组件。');if(v.selected!==null&&(!Number.isInteger(v.selected?.scene)||!valid(v.selected.scene,v.selected.component)))throw Error('选择的组件不存在。');if(!Number.isFinite(v.opacity)||v.opacity<.05||v.opacity>1||!v.layers||Object.keys(v.layers).sort().join(',')!=='markers,muscles,skeleton,surfaces'||Object.values(v.layers).some(x=>typeof x!=='boolean'))throw Error('无效显示设置。');if(v.curve&&!curveOptions.some(o=>o.key===v.curve))throw Error('曲线不存在。');if(!v.measurement||!Number.isInteger(v.measurement.scene)||!components[v.measurement.scene]||!Array.isArray(v.measurement.points)||v.measurement.points.length>3||v.measurement.points.some(c=>!valid(v.measurement.scene,c,['marker','frame'])))throw Error('无效测量。');if(typeof v.note!=='string'||v.note.length>1000)throw Error('备注过长。');return v;}
function restore(v){const checked=validate(v);stop();state=JSON.parse(JSON.stringify(checked));$('curve').value=state.curve;$('opacity').value=state.opacity;$('note').value=state.note;for(const k of Object.keys(state.layers))$(k).checked=state.layers[k];$('measure-scene').value=state.measurement.scene;pointOptions();const savedCurve=state.curve;if(state.selected)choose(state.selected.scene,state.selected.component);else{$('selection').textContent='点击模型，或展开组件列表';$('hide-selected').disabled=true;tree();}state.curve=savedCurve;$('curve').value=savedCurve;selectFrame(state.frame);status('已恢复查看状态。');}
$('save-view').addEventListener('click',()=>{state.note=$('note').value;download('opensim-view.json','application/json',JSON.stringify(state,null,2));status('已保存。重新打开工作台后可用“恢复状态”载入该文件。');});$('load-view').addEventListener('click',()=>$('state-file').click());$('state-file').addEventListener('change',async()=>{const file=$('state-file').files[0];if(!file)return;try{if(file.size>256*1024)throw Error('状态文件过大。');restore(JSON.parse(await file.text()));}catch(e){status('未恢复：'+e.message);}finally{$('state-file').value='';}});
for(const k of Object.keys(state.layers))$(k).addEventListener('change',()=>{state.layers[k]=$(k).checked;sync();});$('opacity').addEventListener('input',()=>{state.opacity=+$('opacity').value;sync();});$('note').addEventListener('input',()=>{state.note=$('note').value;});
$('timeline').max=A.times.length-1;$('timeline').addEventListener('input',()=>{stop();selectFrame(+$('timeline').value);});$('play').addEventListener('click',()=>{playing=!playing;last=0;clock=A.times[state.frame];$('play').textContent=playing?'暂停':'播放';document.body.dataset.playing=playing;});$('reset').addEventListener('click',()=>{state.camera={yaw:.7,pitch:.25,zoom:2.7};sync();});
function tick(t){if(playing){if(last){clock+=(t-last)/1000*+$('speed').value;if(clock>A.times.at(-1))clock=A.times[0];state.frame=A.times.reduce((best,v,i)=>v<=clock?i:best,0);sync();}last=t;}requestAnimationFrame(tick);}window.addEventListener('resize',drawCurve);
$('scope').textContent='视角按各场景自身尺寸居中同步；不会自动配准模型。同名组件联动仅表示标识相同。距离/夹角来自原生标记或坐标架原点。';
tree();pointOptions();if(W.initial_state){try{restore(W.initial_state);}catch(e){status(e.message);}}else sync();for(let i=0;i<E.length;i++)views[i].srcdoc=W.embedded[i];requestAnimationFrame(tick);
