  byId('play').addEventListener('click',()=>{playing=!playing;byId('play').textContent=playing?'暂停':'播放';lastStamp=0;document.body.dataset.playing=playing;});
  for(const id of ['surfaces','skeleton','markers','compare','errors','coordinate'])byId(id).addEventListener('change',render);
  byId('reset').addEventListener('click',()=>{yaw=.7;pitch=.25;distance=radius*2.7;render();});
  canvas.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId);});canvas.addEventListener('pointerup',()=>{drag=null;});canvas.addEventListener('pointermove',e=>{if(!drag)return;yaw+=(e.clientX-drag[0])*.008;pitch=Math.max(-1.4,Math.min(1.4,pitch+(e.clientY-drag[1])*.008));drag=[e.clientX,e.clientY];render();});canvas.addEventListener('wheel',e=>{e.preventDefault();distance=Math.max(radius*.3,Math.min(radius*100,distance*Math.exp(e.deltaY*.001)));render();},{passive:false});window.addEventListener('resize',render);
  function tick(stamp){if(playing){if(lastStamp){clock+=(stamp-lastStamp)/1000*(+byId('speed').value);const first=DATA.frames[0].time,last=DATA.frames.at(-1).time;if(clock>last)clock=first;while(index<DATA.frames.length-1&&DATA.frames[index+1].time<=clock)index++;if(clock<DATA.frames[index].time)index=0;render();}lastStamp=stamp;}requestAnimationFrame(tick);}
  const initial=Number(new URLSearchParams(location.search).get('frame'));select(Number.isInteger(initial)?initial:0);document.body.dataset.viewerReady='true';document.body.dataset.meshCount=meshes.length;requestAnimationFrame(tick);
})();

</script></html>
