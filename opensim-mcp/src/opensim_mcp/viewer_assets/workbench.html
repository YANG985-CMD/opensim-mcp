<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<title>OpenSim 可视化工作台</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f8;color:#20384a;font:14px system-ui,sans-serif}header{background:#fff;border-bottom:1px solid #dae3ea;padding:16px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}h1{font-size:21px;margin:0}header p{margin:4px 0;color:#637b8c;font-size:12px}.actions{margin-left:auto;display:flex;gap:8px}button,select,input,textarea{font:inherit;color:inherit}button,select{border:1px solid #becfdc;background:white;border-radius:7px;padding:8px 10px;cursor:pointer}button.primary{background:#126e93;border-color:#126e93;color:#fff}button:disabled{opacity:.45;cursor:default}main{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:16px;padding:18px;max-width:1700px;margin:auto}.workspace,.panel{background:#fff;border:1px solid #d7e2ea;border-radius:12px;overflow:hidden}.workspace{align-self:start}.views{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));min-width:0}.views.single{grid-template-columns:1fr}.view{position:relative;min-width:0}.view+.view{border-left:1px solid #d7e2ea}.view-title{padding:12px 14px;display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #e3eaf0}.view-title strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.view-title span{font-size:12px;color:#61788a;font-variant-numeric:tabular-nums}.view iframe{display:block;width:100%;height:550px;border:0}.unmatched{position:absolute;inset:42px 0 0;display:grid;place-items:center;background:#f2f6f9;color:#765f2e;padding:30px;text-align:center}.unmatched[hidden]{display:none}.transport{padding:13px;display:flex;align-items:center;gap:10px;border-top:1px solid #d7e2ea;flex-wrap:wrap}#timeline{flex:1;min-width:140px;accent-color:#126e93}#time{font-variant-numeric:tabular-nums;min-width:65px}.panel{padding:16px}h2{font-size:15px;margin:0 0 12px}label{display:block;margin:10px 0}select{max-width:100%;width:100%}.muted{color:#627b8d;font-size:12px;line-height:1.6}.selected{padding:11px;background:#edf5fa;border-radius:8px;overflow-wrap:anywhere;font-size:13px}details{border-top:1px solid #e3eaf0;padding-top:12px;margin-top:14px}summary{cursor:pointer;font-weight:600}.tree{max-height:230px;overflow:auto;margin:10px 0}.tree button{display:block;text-align:left;width:100%;border:0;border-radius:4px;padding:7px;font-size:12px;overflow-wrap:anywhere}.tree button.active{background:#e5f3fa;color:#126e93}.tree .group{color:#6c8190;font-size:12px;padding:7px 3px}#search{width:100%;border:1px solid #c5d4df;border-radius:6px;padding:8px}#plot{width:100%;height:180px;display:block}.values{display:flex;gap:8px;flex-wrap:wrap;font-variant-numeric:tabular-nums}.values span{padding:6px 9px;background:#f0f5f8;border-radius:5px;font-size:12px}.blue{color:#126e93}.orange{color:#af681a}.buttons{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}#status{min-height:22px;padding:0 20px 16px;color:#4f6c7f;font-size:13px}textarea{width:100%;min-height:70px;border:1px solid #c5d4df;border-radius:7px;padding:8px;resize:vertical}#measurement-value{font-size:18px;margin:12px 0}.inline{display:flex;gap:14px;flex-wrap:wrap}.inline label{font-size:13px}input[type=checkbox]{accent-color:#126e93}footer{padding:0 20px 18px;max-width:1700px;margin:auto}.legend{margin-top:8px}.legend span{margin-right:14px}#curve-note{margin:6px 0}#hidden-count{font-size:12px;font-weight:400;color:#627b8d}@media(max-width:1000px){main{grid-template-columns:1fr}.panel{display:block}.view iframe{height:420px}}@media(max-width:650px){header{padding:12px}.actions{margin-left:0}main{padding:10px}.views{grid-template-columns:1fr}.view+.view{border-left:0;border-top:1px solid #d7e2ea}.view iframe{height:330px}}

<header><div><h1>OpenSim 可视化工作台</h1><p>拖动旋转 · 滚轮缩放 · 点击选择</p></div><div class="actions"><button id="save-view">保存查看状态</button><button id="load-view">恢复状态</button><input id="state-file" type="file" accept=".json,application/json" hidden></div></header>
<main><section class="workspace"><div class="views" id="views"></div><div class="transport"><button id="play" class="primary" disabled>播放</button><input id="timeline" type="range" min="0" value="0" step="1" aria-label="共同时间轴" disabled><span id="time">—</span><select id="speed" aria-label="播放速度" style="width:auto"><option value=".5">0.5 倍</option><option value="1" selected>1 倍</option><option value="2">2 倍</option></select><button id="reset">重置视角</button></div></section>
<aside class="panel"><h2>当前选择</h2><div id="selection" class="selected">点击模型，或展开组件列表</div><div class="buttons"><button id="hide-selected" disabled>隐藏所选</button><button id="show-all">全部显示</button></div>
<details id="components"><summary>组件列表 <span id="hidden-count"></span></summary><select id="component-scene" aria-label="组件所在场景"></select><input id="search" placeholder="搜索组件" aria-label="搜索组件"><div id="tree" class="tree"></div></details>
<details open id="curves"><summary>曲线对比</summary><select id="curve" aria-label="选择曲线"></select><canvas id="plot" aria-label="结果对比曲线，点击定位姿态"></canvas><div class="values"><span class="blue" id="value-a">—</span><span class="orange" id="value-b">—</span><span id="value-diff">—</span></div><p class="muted" id="curve-note"></p><button id="export-curve">导出曲线</button></details>
<details id="measure"><summary>距离与角度</summary><p class="muted">选择标记点或坐标架原点。两点测距离，三点测中间点夹角。</p><select id="measure-scene" aria-label="测量所在场景"></select><select id="point-0" aria-label="测量点 A"></select><select id="point-1" aria-label="测量点 B"></select><select id="point-2" aria-label="测量点 C，可选"></select><div id="measurement-value">—</div><button id="export-measure">导出测量曲线</button><p class="muted">不代表解剖关节角、表面间隙或碰撞检测。</p></details>
<details><summary>显示与备注</summary><div class="inline"><label><input id="surfaces" type="checkbox" checked> 表面</label><label><input id="muscles" type="checkbox" checked> 肌肉</label><label><input id="markers" type="checkbox"> 标记</label><label><input id="skeleton" type="checkbox"> 框架</label></div><label>表面透明度 <input id="opacity" type="range" min=".05" max="1" step=".05" value="1" aria-label="表面透明度"></label><textarea id="note" maxlength="1000" placeholder="记录本次比较的条件或观察"></textarea><p class="muted">状态保存在下载的 JSON 中；恢复时核对原场景和时间设置。</p></details>
</aside></main><div id="status" role="status" aria-live="polite">正在加载三维视图…</div><footer class="muted" id="scope"></footer>
